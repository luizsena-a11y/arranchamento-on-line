<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arranchamento on-line</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Open+Sans:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./favinco/android-chrome-512x512.png">

</head>

<body>


    <div class="container">
        <div class="background-image">

        </div>

        <form class="form-card" method="POST" action="/enviar">
            
            <div class="logo"></div>

            <div class="form-input input-1">
                <input type="text" placeholder="Qantidade do café">
            </div>

            <div class="form-input input-2">
                <input type="text" placeholder="quantidade do almoço">
            </div>

            <div class="form-input input-3">
                <input type="text" placeholder="quantidade da janta">
            </div>

            <div class="form-input input-4">
                <input type="text" placeholder="quantidade da ceia">
            </div>

            <div class="form-input input-7">
                <input type="text" placeholder="nome">
            </div>

            <div class="form-input input-5">
                <input type="text" placeholder="Qual e o seu batalhão">
            </div>

            <div class="form-input input-6">
                <input type="text" placeholder="Qual e a sua companhia">
            </div>
            <div><input type="date" name="dia" id="data"> </div>

            <button class="confirm-button" input type="submit">
                <span>confirma</span>
            </button>
        </form>
    </div>
</body>

</html>
